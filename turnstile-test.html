
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Chunks Security Test</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js"
          async defer></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 24px;
      max-width: 450px;
      margin: auto;
    }
    button {
      padding: 15px;
      margin-top: 20px;
      font-size: 16px;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h2>Chunks Security Test</h2>
  <p>This page does not place orders.</p>

  <div class="cf-turnstile"
       data-sitekey="0x4AAAAAAFsI7CIpGXeJO5Fd">
  </div>

  <button onclick="runTest()">
    Test Security
  </button>

  <pre id="result">Waiting for test...</pre>

  <script>
    const PUBLIC_KEY = "sb_publishable_frXO1x0YBUksnwntgCBJiQ_B-XjcHIS";

    async function runTest() {
      const output = document.getElementById("result");
      const token = window.turnstile?.getResponse();

      if (!token) {
        output.textContent =
          "Complete the Cloudflare check first.";
        return;
      }

      output.textContent = "Testing...";

      try {
        const response = await fetch(
          "https://qyhzbfdkjvjjbnkceowi.supabase.co/functions/v1/submit-order-v3-test",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": PUBLIC_KEY,
              "Authorization": "Bearer " + PUBLIC_KEY
            },
            body: JSON.stringify({
              turnstile_token: token
            })
          }
        );

        const result = await response.json();

        output.textContent =
          "HTTP " + response.status + "\n" +
          JSON.stringify(result, null, 2);

      } catch (error) {
        output.textContent =
          "Connection error: " + error.message;
      } finally {
        window.turnstile?.reset();
      }
    }
  </script>
</body>
</html>
